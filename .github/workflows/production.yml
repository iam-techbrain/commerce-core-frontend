name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Verify Deployment Status
        run: |
          echo "Frontend build successfully generated in /dist"
          echo "Application: commerce-core-frontend"
          echo "Status: Active Production"
